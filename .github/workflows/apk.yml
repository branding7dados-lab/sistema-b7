# App Android do Sistema B7 (pacote zzy): gera o APK assinado e publica
# em Releases sempre que a casca muda (pasta android/ ou apk.json).
# O link fixo do APK mais novo:
#   https://github.com/branding7dados-lab/sistema-b7/releases/latest/download/sistema-b7.apk
name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'apk.json', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Versão (build.gradle e apk.json precisam bater)
        id: versao
        run: |
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle)
          VN=$(grep -oP "versionName\s+'\K[^']+" android/app/build.gradle)
          JC=$(python3 -c "import json;print(json.load(open('apk.json'))['versionCode'])")
          echo "build.gradle: $VC ($VN) | apk.json: $JC"
          if [ "$VC" != "$JC" ]; then echo "::error::versionCode diferente entre android/app/build.gradle ($VC) e apk.json ($JC)"; exit 1; fi
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Chave de assinatura (segredos do repositório)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_SENHA" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_SENHA (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sistema-b7.jks"
          echo "ANDROID_KEYSTORE_ARQUIVO=$RUNNER_TEMP/sistema-b7.jks" >> "$GITHUB_ENV"

      - name: Gerar APK assinado
        env:
          ANDROID_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Conferir assinatura
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" sistema-b7.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.versao.outputs.code }}
          name: App Android ${{ steps.versao.outputs.name }}
          body: |
            App Android do Sistema B7 — versão ${{ steps.versao.outputs.name }} (código ${{ steps.versao.outputs.code }}).
            O conteúdo do sistema atualiza sozinho; este APK só muda quando a casca do app muda.
            Instalar: baixe sistema-b7.apk no celular e abra (permita "instalar apps desconhecidos" para o Chrome na primeira vez).
          files: sistema-b7.apk
          make_latest: true
