# Publica as Edge Functions do Supabase sozinho quando algo em
# supabase/functions/ muda na main (zzz164).
# Precisa do segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings → Secrets
# and variables → Actions). Sem ele, o passo avisa e não faz nada.
name: funcoes
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/funcoes.yml']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJETO: rartcafydsaocdzshqcx
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # versão fixa: "latest" consulta a API do GitHub e falha por limite de uso
          version: 2.20.5
      - name: Publicar b7-ia
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — nada publicado"; exit 0; fi
          # zzz250: empacota pela API do Supabase (sem baixar a imagem Docker, que
          # o ghcr.io recusou por excesso de pedidos; se a API falhar, usa o Docker);
          # tenta 3 vezes antes de desistir
          for t in 1 2 3; do
            { supabase functions deploy b7-ia --project-ref "$PROJETO" --no-verify-jwt --use-api || supabase functions deploy b7-ia --project-ref "$PROJETO" --no-verify-jwt; } && exit 0
            echo "tentativa $t falhou; esperando"; sleep $((t * 20))
          done
          exit 1
      # zzz218: a b7-auth (login, verificação em 2 etapas) também sai daqui.
      # O código dela no repositório é o mesmo que estava publicado à mão.
      - name: Publicar b7-auth
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — nada publicado"; exit 0; fi
          # zzz250: empacota pela API do Supabase (sem baixar a imagem Docker, que
          # o ghcr.io recusou por excesso de pedidos; se a API falhar, usa o Docker);
          # tenta 3 vezes antes de desistir
          for t in 1 2 3; do
            { supabase functions deploy b7-auth --project-ref "$PROJETO" --no-verify-jwt --use-api || supabase functions deploy b7-auth --project-ref "$PROJETO" --no-verify-jwt; } && exit 0
            echo "tentativa $t falhou; esperando"; sleep $((t * 20))
          done
          exit 1
      # zzz279: a google-agenda (conexão com o Google Agenda) também sai daqui.
      # O código do repositório é o mesmo publicado (versão 2026-09-15-f) mais
      # a volta por google-retorno.html.
      - name: Publicar google-agenda
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — nada publicado"; exit 0; fi
          for t in 1 2 3; do
            { supabase functions deploy google-agenda --project-ref "$PROJETO" --no-verify-jwt --use-api || supabase functions deploy google-agenda --project-ref "$PROJETO" --no-verify-jwt; } && exit 0
            echo "tentativa $t falhou; esperando"; sleep $((t * 20))
          done
          exit 1
      # zzz297: a b7-push (avisos no celular e no navegador) também sai daqui.
      # O código do repositório era o mesmo publicado à mão (versão zzz152).
      - name: Publicar b7-push
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — nada publicado"; exit 0; fi
          for t in 1 2 3; do
            { supabase functions deploy b7-push --project-ref "$PROJETO" --no-verify-jwt --use-api || supabase functions deploy b7-push --project-ref "$PROJETO" --no-verify-jwt; } && exit 0
            echo "tentativa $t falhou; esperando"; sleep $((t * 20))
          done
          exit 1
