# App B7 NATIVO (React Native + Expo, pasta app-nativo/) — prévia.
# A cada publicação no main que mexa em app-nativo/ (ou à mão: Actions →
# App nativo → Run workflow) gera o APK, assina com a mesma chave do app
# atual e publica em Releases como "app-nativo-v<n>", marcado como PRÉVIA:
# assim o app atual (que confere a última release) não confunde os dois.
# Num pull request, só monta (confere que compila).
name: App nativo
on:
  push:
    branches: [main]
    paths: ['app-nativo/**', '.github/workflows/app-nativo.yml']
  pull_request:
    paths: ['app-nativo/**', '.github/workflows/app-nativo.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-nativo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-nativo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-nativo/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Dependências
        run: npm ci
      - name: Conferência (tipos e Expo)
        run: |
          npx tsc --noEmit
          npx --yes expo-doctor
      - name: Versão
        run: |
          echo "B7N_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          node -e "const f='app.json',a=require('./'+f);a.expo.android.versionCode=1000+Number(process.env.GITHUB_RUN_NUMBER);a.expo.version='0.1.'+process.env.GITHUB_RUN_NUMBER;require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - name: Gerar o projeto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar
        working-directory: app-nativo/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Assinar
        if: github.event_name != 'pull_request'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/b7.jks"
          if [ -z "$ALIAS" ]; then
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/b7.jks" -storepass "$SENHA" | grep -m1 PrivateKeyEntry | cut -d, -f1)
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/b7.jks" --ks-pass env:SENHA --ks-key-alias "$ALIAS" \
            --out "$RUNNER_TEMP/b7-app.apk" android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify "$RUNNER_TEMP/b7-app.apk"
      - name: Publicar a prévia
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-nativo-v$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/b7-app.apk#b7-app.apk" \
            --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "App B7 nativo — prévia $GITHUB_RUN_NUMBER" \
            --notes "Prévia do app nativo (React Native). Instala ao lado do app atual: são dois apps diferentes."
