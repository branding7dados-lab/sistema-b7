# Publica o site no GitHub Pages (Settings → Pages → Source: "GitHub Actions").
# Monta só os arquivos do site em _site/, compacta JS/CSS e, antes de
# publicar, abre todas as telas na versão compactada (teste de fumaça).
# Se o teste falhar, nada é publicado e o site anterior continua no ar.
name: Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  montar:
    runs-on: ubuntu-24.04   # fixo: o Playwright dos testes ainda não aceita o Ubuntu 26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compactar o site
        working-directory: .github/publicar
        run: npm install --no-audit --no-fund && node montar.mjs
      - name: Testar a versão compactada
        run: |
          cd testes && npm install --no-audit --no-fund && npx playwright install --with-deps chromium && cd ..
          mkdir -p _site/testes && (cd testes && tar cf - --exclude=node_modules .) | (cd _site/testes && tar xf -)
          ln -s "$PWD/testes/node_modules" _site/testes/node_modules
          grep -q "VERSAO = '" _site/js/auth.js || { echo 'js/auth.js perdeu a linha VERSAO: o aviso de atualização pararia'; exit 1; }
          cd _site/testes && node sintaxe.mjs && node fumaca.mjs
      - name: Tirar os testes da cópia publicada
        run: rm -r _site/testes
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    needs: montar
    runs-on: ubuntu-24.04   # fixo: o Playwright dos testes ainda não aceita o Ubuntu 26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
