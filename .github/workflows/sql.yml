# Aplica migrações (supabase/sql/zzzNNN_*.sql) no banco do Sistema B7, pela API de gestão do Supabase.
#  • 23/11/2026: SOZINHO a cada merge na main que traga arquivo zzz novo — só os novos, em ordem, uma vez cada
#    (registro em public.b7_migracoes). O site e as funções esperam este workflow (esperar-banco.sh) e não
#    publicam se ele falhar.
#  • À mão (Actions → sql → Run workflow): aplica o arquivo pedido, se ainda não estiver registrado.
# Usa o segredo SUPABASE_ACCESS_TOKEN das funções; nada de chave no código.
name: sql
on:
  push:
    branches: [main]
    paths: ['supabase/sql/zzz*.sql']
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Caminho do arquivo (ex.: supabase/sql/zzz333_modulos_operacoes_site.sql)'
        required: true
concurrency:
  group: sql
  cancel-in-progress: false
jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJETO: rartcafydsaocdzshqcx
      ARQUIVO: ${{ inputs.arquivo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar migrações
        env:
          ANTES: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN não configurado"; exit 1; fi
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            bash .github/publicar/aplicar-sql.sh "$ARQUIVO"
          else
            if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then ANTES="$GITHUB_SHA~1"; fi
            mapfile -t novas < <(git diff --diff-filter=A --name-only "$ANTES" "$GITHUB_SHA" -- 'supabase/sql/zzz*.sql')
            bash .github/publicar/aplicar-sql.sh "${novas[@]}"
          fi
