/* App Android do Sistema B7 (pacote zzy, 03/10)
   É uma "Trusted Web Activity": abre o sistema publicado no GitHub Pages
   dentro do Chrome, em tela cheia. O conteúdo atualiza sozinho (é o
   próprio site); este APK só muda quando a casca muda — e aí o sistema
   avisa dentro do app (apk.json + js/app-android.js).
   Para soltar uma versão nova da casca: suba versionCode/versionName
   aqui E em apk.json, na raiz do repositório. */
plugins { id 'com.android.application' }

def SITE = 'branding7dados-lab.github.io'
def CAMINHO = '/sistema-b7/'

android {
    namespace 'br.com.branding7.sistemab7'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.branding7.sistemab7'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        manifestPlaceholders = [
            hostName: SITE,
            defaultUrl: 'https://' + SITE + CAMINHO + '?app=android&apk=' + versionCode,
            launcherName: 'Sistema B7'
        ]
    }

    /* A chave de assinatura NÃO fica no repositório (ele é público): o
       GitHub Actions a recebe dos segredos ANDROID_KEYSTORE_BASE64 e
       ANDROID_KEYSTORE_SENHA e a grava em ANDROID_KEYSTORE_ARQUIVO.
       Sem esses segredos o APK não é gerado. Trocar a chave impede o
       Android de instalar a atualização por cima — guarde a mesma. */
    signingConfigs {
        release {
            def arq = System.getenv('ANDROID_KEYSTORE_ARQUIVO')
            if (arq) {
                storeFile file(arq)
                storePassword System.getenv('ANDROID_KEYSTORE_SENHA')
                keyAlias 'sistemab7'
                keyPassword System.getenv('ANDROID_KEYSTORE_SENHA')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
