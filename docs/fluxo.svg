<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Fluxo: linha editorial, gravação, produção, aprovação, status semanal">
<defs>
<linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17143F"/><stop offset=".6" stop-color="#2A1752"/><stop offset="1" stop-color="#4A1450"/></linearGradient>
<linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
<linearGradient id="seta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8FA2FF"/><stop offset="1" stop-color="#FF7AC6"/></linearGradient>
<linearGradient id="setav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FA2FF"/><stop offset="1" stop-color="#FF7AC6"/></linearGradient>
<marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF7AC6"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#fff} .t{font-weight:700} .s{fill:#C9C3EE} .k{fill:#FF9AD5;font-weight:700;letter-spacing:2px}
.fl{stroke-dasharray:6 8;animation:corre 1.2s linear infinite} @keyframes corre{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}</style>
</defs><rect width="1200" height="330" rx="28" fill="url(#fundo)"/>
<text x="600.0" y="44" text-anchor="middle" class="k" font-size="18">O CAMINHO DE CADA CONTEÚDO</text>
