<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Sistema B7 — Branding7">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1A5C"/><stop offset=".55" stop-color="#5B2391"/><stop offset="1" stop-color="#B01E82"/>
    </linearGradient>
    <radialGradient id="luz1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 60) scale(420)">
      <stop offset="0" stop-color="#FF7AC6" stop-opacity=".55"/><stop offset="1" stop-color="#FF7AC6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luz2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 380) scale(380)">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity=".45"/><stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <clipPath id="cantos"><rect width="1200" height="400" rx="28"/></clipPath>
    <style>
      .flutua { animation: flutua 7s ease-in-out infinite; }
      .flutua2 { animation: flutua 9s ease-in-out infinite reverse; }
      .passa { animation: passa 6s cubic-bezier(.4,0,.2,1) infinite; }
      .pisca { animation: pisca 3.2s ease-in-out infinite; }
      .pisca:nth-of-type(2n) { animation-delay: 1.1s; } .pisca:nth-of-type(3n) { animation-delay: 2.2s; }
      @keyframes flutua { 50% { transform: translateY(-10px); } }
      @keyframes passa { 0% { transform: translateX(-700px); } 60%, 100% { transform: translateX(1300px); } }
      @keyframes pisca { 50% { opacity: .15; } }
      text { font-family: 'Archivo', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <g clip-path="url(#cantos)">
    <rect width="1200" height="400" fill="url(#fundo)"/>
    <rect width="1200" height="400" fill="url(#luz1)" class="flutua"/>
    <rect width="1200" height="400" fill="url(#luz2)" class="flutua2"/>
    <g fill="#fff">
      <circle class="pisca" cx="905" cy="92" r="3"/><circle class="pisca" cx="1040" cy="150" r="2"/><circle class="pisca" cx="980" cy="300" r="2.5"/>
      <circle class="pisca" cx="1110" cy="250" r="3"/><circle class="pisca" cx="860" cy="330" r="2"/><circle class="pisca" cx="1130" cy="90" r="2"/>
      <circle class="pisca" cx="300" cy="60" r="2"/><circle class="pisca" cx="520" cy="350" r="2.5"/><circle class="pisca" cx="640" cy="70" r="2"/>
    </g>
    <!-- ilha de vidro com o símbolo -->
    <g class="flutua">
      <rect x="880" y="110" width="200" height="200" rx="52" fill="url(#vidro)" stroke="#fff" stroke-opacity=".35"/>
      <image x="920" y="139" width="120" height="142" href="data:image/png;base64,"/>
    </g>
    <text x="80" y="170" fill="#fff" fill-opacity=".75" font-size="22" font-weight="700" letter-spacing="5">BRANDING7</text>
    <text x="78" y="248" fill="#fff" font-size="84" font-weight="900" letter-spacing="-2">Sistema B7</text>
    <text x="80" y="298" fill="#fff" fill-opacity=".82" font-size="24" font-weight="500">Do planejamento à entrega — num lugar só.</text>
    <rect x="0" y="0" width="520" height="400" fill="url(#brilho)" class="passa" transform="skewX(-18)"/>
  </g>
</svg>