<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Confirmar · Sistema B7</title>
<link rel="icon" href="assets/icons/favicon.png">
<!-- zzz221: página do botão do e-mail da verificação em 2 etapas.
     Lê o link (#id.segredo), manda para a b7-auth (email_link) e mostra o
     resultado. O segredo nunca vai na URL de servidor nenhum: fica depois
     do "#", e a página apaga ele da barra assim que lê. -->
<style>
  :root{--fundo:#0A0714;--card:#150F22;--ink:#EDEAF7;--ink2:#A9A2C4;--violeta:#3A1E86;--magenta:#C21C83;--ok:#3ccf8e;--erro:#ff6b8b;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--fundo);color:var(--ink);font:400 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  body{display:grid;place-items:center;min-height:100vh;padding:24px 16px;
    background:radial-gradient(90% 70% at 15% 0%,rgba(58,30,134,.55),transparent 70%),radial-gradient(70% 60% at 100% 100%,rgba(194,28,131,.28),transparent 70%),var(--fundo);}
  .card{width:min(440px,100%);padding:34px 30px 28px;border-radius:26px;background:rgba(21,15,34,.86);border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.7);text-align:center;animation:entra .6s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes entra{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .logo{width:120px;height:auto;margin:0 auto 26px;display:block;opacity:.95}
  .ic{width:74px;height:74px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--violeta),var(--magenta));box-shadow:0 18px 40px -16px rgba(194,28,131,.7);}
  .ic svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ic.ok{background:linear-gradient(135deg,#1f9e6b,var(--ok));box-shadow:0 18px 40px -16px rgba(60,207,142,.6)}
  .ic.erro{background:linear-gradient(135deg,#7a2140,var(--erro));box-shadow:0 18px 40px -16px rgba(255,107,139,.5)}
  .gira{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .check path{stroke-dasharray:30;stroke-dashoffset:30;animation:risca .55s .15s ease forwards}
  @keyframes risca{to{stroke-dashoffset:0}}
  h1{margin:0 0 8px;font:800 23px/1.25 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.01em}
  p{margin:0;color:var(--ink2)}
  .b{display:inline-block;margin-top:24px;padding:14px 22px;border-radius:14px;font-weight:700;color:#fff;text-decoration:none;
    background:linear-gradient(135deg,var(--violeta),var(--magenta));}
  .leve{margin-top:18px;font-size:12.5px;color:#7d7698}
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite">
  <img class="logo" src="assets/brand/logo-white.png" alt="Branding7">
  <div class="ic"><div class="gira" aria-hidden="true"></div></div>
  <h1>Confirmando…</h1>
  <p>Só um instante.</p>
</main>
<script src="js/config.js"></script>
<script>
(function () {
  var card = document.getElementById('card');
  var OK = '<svg class="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var X = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  var SITE = 'https://branding7dados-lab.github.io/sistema-b7/';
  function mostrar(tipo, titulo, texto, botao) {
    card.innerHTML = '<img class="logo" src="assets/brand/logo-white.png" alt="Branding7">' +
      '<div class="ic ' + tipo + '">' + (tipo === 'ok' ? OK : X) + '</div>' +
      '<h1>' + titulo + '</h1><p>' + texto + '</p>' +
      (botao ? '<a class="b" href="' + SITE + '">' + botao + '</a>' : '') +
      '<p class="leve">Sistema B7 · Branding7</p>';
  }
  var c = (location.hash || '').replace(/^#/, '');
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (!/^[0-9a-f-]{36}\.[A-Za-z0-9_-]{20,128}$/i.test(c)) {
    return mostrar('erro', 'Link incompleto', 'Abra o botão direto do e-mail. Se não der, use o código de 6 números que veio junto.', 'Ir para o B7');
  }
  var cfg = window.B7_CONFIG || {};
  var base = String(cfg.SUPABASE_URL || '').trim().replace(/\/+$/, '');
  var chave = String(cfg.SUPABASE_PUBLISHABLE_KEY || cfg.SUPABASE_ANON_KEY || '').trim();
  fetch(base + '/functions/v1/b7-auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: chave, Authorization: 'Bearer ' + chave },
    body: JSON.stringify({ acao: 'email_link', c: c })
  }).then(function (r) { return r.json().catch(function () { return {}; }); }).then(function (d) {
    if (d && d.ok && d.tipo === 'login') {
      return mostrar('ok', 'Entrada confirmada', 'Pode voltar para a tela onde você estava entrando: ela entra sozinha em alguns segundos. Esta página já pode ser fechada.');
    }
    if (d && d.ok && d.tipo === 'cadastro') {
      return mostrar('ok', 'E-mail confirmado', 'A verificação em 2 etapas está ligada' + (d.email ? ' para <b>' + d.email.replace(/[<>&"]/g, '') + '</b>' : '') + '. Nas próximas entradas, o código chega aqui.', 'Abrir o B7');
    }
    var cod = d && d.codigo;
    if (cod === 'usado') return mostrar('erro', 'Link já usado', 'Este link já confirmou. Se você ainda está na tela de acesso, é só esperar ou entrar de novo.', 'Ir para o B7');
    if (cod === 'expirou') return mostrar('erro', 'Link expirado', 'O link vale por 10 minutos. Entre de novo para receber outro.', 'Ir para o B7');
    mostrar('erro', 'Não deu para confirmar', (d && d.erro) || 'Tente de novo ou use o código de 6 números do e-mail.', 'Ir para o B7');
  }).catch(function () {
    mostrar('erro', 'Sem conexão', 'Não conseguimos falar com o B7. Confira a internet e abra o link de novo.');
  });
})();
</script>
</body>
</html>
